# @package _global_
# Generated as the LETTER counterpart of tiger_unlearn_seif_flat.yaml: same everything, except the
# model target and LETTER's generation-loss temperature. Keep the two in
# step -- an option added to the tiger config and not here is an option the
# LETTER arm of a sweep silently does not have.

# Seif = Gaussian-noise erase + repair fine-tune (NeurIPS-2023 Machine
# Unlearning Challenge "noise + repair" winner). Distinct from scif (the
# influence-function method).

defaults:
  - letter_unlearn_scif_flat
  - _self_

unlearning:
  algorithm: seif

tags:
  - amazon-p5-gr-unlearn-seif
