# Shared unlearning defaults — included by experiment configs via defaults list.

unlearning:
  algorithm: scif  # scif | seif | kookmin | fanchuan | unified | finetune | neg_train | filter | retrain
  deletion_spec: session  # session | item | item_pairs
  # item_pairs mode: unlearn only the (prefix → target_item) training pairs
  # from spam sessions.  Set unlearn_whole_items: true to also unlearn those
  # pairs from clean retain sessions (suppresses the target item globally).
  # In sequential mode use request_user_order: sorted (not manifest) because
  # item_pairs entries have synthetic user_ids that do not appear in the manifest.
  unlearn_whole_items: false
  forget_size: null

  # Retain / repair budget = retain_sample_size (or repair_sample_bound) * |D_f|
  retain_samples_used_for_update: 16
  retain_sample_size: null
  repair_sample_bound: null  # alias; defaults to retain_samples_used_for_update
  retain_max_rows: null

  # Neighborhood construction
  neighborhood_aware: false
  neighborhood_method: prefix  # prefix | embedding
  neighborhood_aware_sample_rate: 1.0
  neighbor_aware_factor: 8.0
  sid_prefix_length: 2
  progressive_sid_prefix: true
  embedding_path: null
  embedding_epsilon: null
  embedding_max_neighbors: 100

  # Sequential chunking: set one of these (n_unlearning_chunks takes priority)
  # request_batch_size: fixed users per chunk; n_unlearning_chunks: fixed number of chunks
  n_unlearning_chunks: null

  # SCIF numerics
  damping: 0.01
  cg_max_iter: 200
  cg_tol: 1.0e-5
  cg_solution_max_norm: null
  max_norm: null
  update_max_norm: 1.0
  batch_size_per_device: 256
  target_params: tiger
  eval_mode: true
  rows_per_shard: 4096

  # --- RQ-ID position-wise intervention (scif; parameter restriction) ---
  # Confine the SCIF update to selected RQ semantic-ID code positions. This is
  # the more general sibling of adaptive_codes (which only freezes a contiguous
  # *prefix*): update_positions accepts ANY subset of code positions.
  #   null / "all"  -> no restriction (uses target_params over the whole model)
  #   [0]           -> c1 only         [2,3] -> [c3,c4]      [0,1] -> [c1,c2]
  #   [c1,c2]       -> same as [0,1]   (cN names are 1-based; bare ints 0-based)
  # When set, ONLY those positions' params move: decoder head decoder_mlp[h] +
  # SID embedding rows [h*K,(h+1)*K). The shared transformer backbone stays
  # frozen unless update_positions_backbone=true.
  update_positions: null
  update_positions_backbone: false

  # --- RQ-ID diagnostics (python -m src.diagnose_rq_ids) ---
  # both | positions | code_sharing. Read-only; no weight update.
  diagnostics_mode: both

  # Fine-tune baseline
  finetune_steps: 500
  finetune_lr: 0.001

  # Negative training baseline
  neg_train_steps: 200
  neg_train_lr: 0.001
  neg_retain_every: 5

  # Filter baseline (decode-time masking, no weight update)
  filter_mode: global  # global | user_dependent

  # Unified objective (Step 3)
  # L = L_R + lambda_f*L_F + lambda_s*L_sep + lambda_n*L_n
  forget_loss_level: token  # token | sequence
  lambda_f: 1.0
  lambda_s: 0.1
  # Coherence loss L_n, prefix-neighbour variant; off by default. Teacher-forces
  # i_T's closest catalog neighbours (shared SID prefix length >=
  # neighborhood_prefix_length, forget items excluded) on the forget history.
  lambda_n: 0.0
  neighborhood_count: 4
  neighborhood_prefix_length: 2
  # target_only (default) = score only rows whose label IS a deletion target;
  # all = every forget row (pre-2026-08-05 behaviour, >=92% filler neighbourhoods
  # on bandwagon — kept only to reproduce the original lambda_n grid).
  coherence_rows: target_only
  # prefix (default) = shared-SID-prefix neighbourhood (width-dependent, can be
  # empty); embedding = fixed-size top-k in the pre-quantization space
  # (unlearning.embedding_path), never empty, width-independent.
  coherence_neighbor_method: prefix
  coherence_embedding_metric: cosine  # cosine | l2 (embedding method only)
  # mass = -log sum_p p(s_p | H_f), bounded and satisfiable (recommended);
  # nll = TRACER Eq. 9 per-neighbour -log p, infeasible optimum (back-compat).
  coherence_loss_type: nll
  sep_temperature: 0.07
  # L_sep negatives: forget (default; all visible I_f forget-shard items — under
  # deletion_spec=session this is every distinct item in the spam sessions, not
  # just the targets) | forget_target_only (only the n_target spam target items,
  # regardless of deletion_spec) | random_retain (ablation: randomly sampled
  # retain-set item ids, to measure how much the directed forget negatives help).
  sep_negatives: forget
  # Number of random negatives when sep_negatives=random_retain
  # (null → match the size of the default neighbor negative set).
  sep_num_random_negatives: null
  unified_steps: 500
  # Shared "number of passes/epochs" knob.
  #   unified: total optim steps = n_epochs * min(n_forget_batches, n_retain_batches);
  #            if set, takes priority over unified_steps.
  #   seif:    number of repair epochs (overrides seif_repair_epochs).
  # null → each algorithm uses its own per-algorithm default.
  n_epochs: null
  unified_lr: 1.0e-4

  # Stable-Adaptive Semantic IDs (unlearning-aware ID design; wired for
  # algorithm=unified). adaptive_codes=true confines the update to the adaptive
  # (fine-grained) tail [stable_codes, num_hierarchies) of each item's RQ id:
  # only those SID embedding rows + decoder heads move; stable codes are frozen.
  # Align neighborhood preservation with sid_prefix_length=stable_codes.
  # adaptive_update_backbone also lets the shared transformer backbone move.
  adaptive_codes: false
  stable_codes: 2
  adaptive_update_backbone: false
  # adaptive_adapter=true ("option 2"): freeze the shared adaptive table/heads
  # and train a per-item, per-adaptive-position offset (masked to forget∪
  # neighbor items) for genuinely item-local updates. Default false ("option 1":
  # move shared adaptive rows + heads). Option 2 adds adaptive_item_offset to the
  # checkpoint; eval with +model.adaptive_item_offset_stable_codes=<stable_codes>.
  adaptive_adapter: false

  # Kookmin (gradient-guided reinitialization + scaled retain repair)
  kookmin_init_rate: 0.01
  kookmin_neg_grad_sample_size: 128
  kookmin_retain_epochs: 1
  kookmin_retain_lr: 0.001
  kookmin_scale_for_reinit: 10.0

  # Fanchuan (uniform-pseudolabel KL + contrastive forget/retain)
  fanchuan_lr: 0.001
  fanchuan_uniform_epochs: 1
  fanchuan_contrastive_iters: 8
  fanchuan_contrastive_temperature: 1.15
  fanchuan_retain_epochs_per_iter: 1

  # Seif (Gaussian-noise erase + repair fine-tune; distinct from scif)
  seif_erase_std: 0.6
  seif_erase_std_final: 0.005
  seif_repair_epochs: 4
  seif_repair_lr: 0.0007
  seif_weight_decay: 0.0005
  # null → target params whose name contains "embedding" or "mlp"
  seif_noise_param_keywords: null

  # Step 4 local repair (optional, default off)
  local_repair:
    enabled: false
    logit_suppression: false
    adapter_repair: false
    prefix_repair: false
    mass_regularization: false
    gamma: 1.0
